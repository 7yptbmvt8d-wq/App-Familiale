name: Déployer la démo (GitHub Pages)

on:
  push:
    branches: [claude/awesome-cerf-rg1uvo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Sous-chemin du dépôt pour Pages (casse exacte du nom de dépôt).
      VITE_BASE: /App-Familiale/
      # Évite le téléchargement des navigateurs Playwright pendant npm ci.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Backend réel : projet Firebase de la famille.
      # (Les clés "web" Firebase ne sont pas secrètes : la sécurité vient des
      #  règles Firestore/Storage + domaines autorisés.)
      VITE_BACKEND: firebase
      VITE_FIREBASE_API_KEY: AIzaSyDjcXtoF1Fx5vs8hoszV5NO879qpvLYY2U
      VITE_FIREBASE_AUTH_DOMAIN: app-famille-bd0ae.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: app-famille-bd0ae
      VITE_FIREBASE_STORAGE_BUCKET: app-famille-bd0ae.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "638754135304"
      VITE_FIREBASE_APP_ID: "1:638754135304:web:16ba36478ec134ffb620bd"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
